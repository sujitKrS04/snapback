# Pyrefly Language Server Configuration
project-includes = [
    "agent.py",
    "backend.py",
    "orchestrator.py",
    "run_agent.py",
    "harness.py",
    "tests/**/*.py",
]

project-excludes = [
    ".venv/**",
    "__pyrefly_virtual__/**",
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**",
    "scratch/**",
]

use-ignore-files = true
ignore_missing_imports = true
